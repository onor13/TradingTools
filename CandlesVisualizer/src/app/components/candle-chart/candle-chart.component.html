<div class="empty-chart {{ !isEditableChart ? 'non-editable' : '' }}" style="width: 100%; max-width: {{ isEditableChart ? '100%' : '800px' }}; margin: 0 auto;">
  <div class="chart-container" style="position: relative; width: 100%; height: {{ isEditableChart ? '600px' : '400px' }}">
    <canvas #chartCanvas style="width: 100%; height: 100%" width="{{ isEditableChart ? 1920 : 800 }}" height="{{ isEditableChart ? 600 : 400 }}"></canvas>

    <!-- CDK Drag-Drop Overlay Elements for Editable Chart -->
    <ng-container *ngIf="isEditableChart && candles && candles.length > 0">
      <!-- Container for CDK drop list -->
      <div class="cdk-drop-list-container" [style.width]="'100%'" [style.height]="'100%'" cdkDropList [cdkDropListData]="candles" (cdkDropListDropped)="onCdkDrop($event)">
        <ng-container *ngFor="let candle of candles; let i = index">
          <!-- High Wick Drag Area (drag down to decrease high) -->
          <div class="cdk-drag high-drag-area" cdkDrag [cdkDragData]="dragCandle(i)"
               [attr.data-candle-index]="i"
               [attr.data-drag-type]="'high'"
               [style.left.px]="getCandlePosition(i)"
               [style.width.px]="getCandleWidth(i) + 4"
               [style.height.px]="'50%'">
            <!-- Drag handle indicator (circle at top of high wick) -->
            <div class="cdk-drag-handle high-indicator" style="position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 28px; height: 28px; background: #ff5722; border-radius: 50%; opacity: 0.4; transition: all 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 10;">
              <div class="drag-arrow" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 10px solid #ff5722;"></div>
            </div>

            <!-- Visual line showing the high wick area -->
            <div class="wick-guide-line" [style.top.px]="'0'" [style.height.px]="'50%'"></div>
          </div>

          <!-- Low Wick Drag Area (drag up to increase low) -->
          <div class="cdk-drag low-drag-area" cdkDrag [cdkDragData]="dragCandle(i)"
               [attr.data-candle-index]="i"
               [attr.data-drag-type]="'low'"
               [style.left.px]="getCandlePosition(i)"
               [style.width.px]="getCandleWidth(i) + 4"
               [style.top.px]="'50%'"
               [style.height.px]="'50%'">
            <!-- Drag handle indicator (circle at bottom of low wick) -->
            <div class="cdk-drag-handle low-indicator" style="position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); width: 28px; height: 28px; background: #4caf50; border-radius: 50%; opacity: 0.4; transition: all 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 10;">
              <div class="drag-arrow" style="position: absolute; bottom: 50%; left: 50%; transform: translate(-50%, 50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid #4caf50;"></div>
            </div>

            <!-- Visual line showing the low wick area -->
            <div class="wick-guide-line" [style.bottom.px]="'0'" [style.height.px]="'50%'"></div>
          </div>
        </ng-container>
      </div>
    </ng-container>
  </div>
</div>
